# =============================================================================
#  Pengaturan bersama — SATU sumber kebenaran untuk kedua skrip:
#    tracker-harian.sh (bash)  &  tracker-harian.ps1 (PowerShell)
#  Format: KEY=value  (komentar diawali '#', nilai tanpa tanda kutip)
