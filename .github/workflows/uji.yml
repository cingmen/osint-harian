name: uji

# Penjaga regresi untuk dua invariant yang mudah rusak tanpa ketahuan:
#   1) nama snapshot/manifest memakai HARI ZONA PROYEK (WIB), bukan zona runner;
#   2) berkas final snapshot TIDAK PERNAH terhapus oleh jalur gagal/LEWAT/rusak.
# Sengaja dijalankan sebagai `TZ=UTC` untuk meniru runner: hasilnya harus tetap
# hari WIB. Self-test berjalan di sandbox dan tidak menulis apa pun ke repo.
# Penjaga ini juga dijalankan dari selesainya workflow `update`.
#
# Alasannya: commit harian di-push memakai GITHUB_TOKEN bawaan, dan event yang
# dibuat GITHUB_TOKEN tidak memicu workflow lain. Akibatnya commit otomatis --
# justru yang paling mungkin merusak kedua invariant di atas -- tidak pernah
# divalidasi oleh workflow ini. `workflow_run` dipicu oleh SELESAINYA sebuah run,
# bukan oleh push, jadi batasan itu tidak berlaku di sini.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [update]
    types: [completed]

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    # Saat dipicu oleh workflow_run, lanjut hanya bila run `update` berhasil --
    # kalau run harian gagal, tidak ada commit baru yang perlu divalidasi.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Jejak audit: memastikan commit yang divalidasi memang kepala default
      # branch saat run ini dipicu (termasuk saat dipicu workflow_run harian).
      - name: Catat commit yang divalidasi
        run: |
          echo "kejadian : ${{ github.event_name }}"
          echo "commit   : $(git rev-parse HEAD)"
          echo "pesan    : $(git log -1 --pretty=%s)"

      - name: Cek sintaks skrip bash
        run: |
          chmod +x tracker-harian.sh
          bash -n tracker-harian.sh
          echo "Sintaks tracker-harian.sh OK."

      - name: Self-test zona WIB & snapshot non-destruktif
        run: ./tracker-harian.sh --uji-error

      - name: Pastikan self-test tidak menyentuh berkas repo
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::self-test meninggalkan perubahan di repo:"
            git status --porcelain
            exit 1
          fi
          echo "Repo tetap bersih setelah self-test."
