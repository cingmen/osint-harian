# =============================================================================
#  Pengaturan bersama — SATU sumber kebenaran untuk kedua skrip:
#    tracker-harian.sh (bash)  &  tracker-harian.ps1 (PowerShell)
#  Format: KEY=value  (komentar diawali '#', nilai tanpa tanda kutip)
# =============================================================================

# --- Identitas ---
PROJECT_NAME=osint-harian
CONTACT=https://cingmen.github.io/osint-harian
SITE_BASE=https://cingmen.github.io/osint-harian

# --- Zona waktu (PENTING: menentukan NAMA snapshot & manifest) ---
# Nama berkas snapshot dan label hari di manifest/feed memakai HARI ZONA INI,
# bukan zona mesin/runner. Cron Actions berjalan 00:00 WIB = 17:00 UTC; dengan
# zona lokal runner (UTC) snapshot jadi berlabel hari yang sudah lewat sehingga
# folder lama ditulis ulang sesudah hari baru ada (urutan manifest terbalik).
ZONA=Asia/Jakarta
# Offset tetap zona di atas (menit, positif = timur UTC). Dipakai bila database
# zona sistem tidak tersedia (container minimal / MSYS tanpa tzdata).
# Asia/Jakarta = +07:00 dan tidak punya DST, jadi nilainya selalu tepat.
ZONA_MENIT=420

# --- Ambang & retensi ---
ANOMALI_THRESHOLD=3
RETENTION_DAYS=90
RSS_MAX_ITEMS=50
TELEGRAM_LIMIT=4000
SNIPPET_MAX=300

# --- Kata kunci pemantauan (dipisah koma, case-insensitive) ---
KEYWORDS_WATCH=sanction,eruption,zero-day

# --- Sumber yang host-nya memblokir IP datacenter (mis. runner GitHub Actions) ---
# Dipisah koma, dicocokkan dengan LABEL sumber pada log/manifest (tanpa spasi
# setelah koma). Saat berjalan di CI (GITHUB_ACTIONS=true), HTTP 403/451 dari
# sumber ini dicatat LEWAT dengan alasan jelas — bukan GAGAL — supaya hitungan
# GAGAL tetap bermakna dan tidak memberi alarm palsu setiap hari.
# Host-host ini terbukti 403 untuk semua variasi User-Agent dari runner GitHub
# (CNBC/CNN di belakang Cloudflare); dari IP residensial normal.
BLOKIR_CI=RSS cnbcindonesia,RSS cnnindonesia,CISA Advisories

# --- Wikipedia (pageviews) ---
WIKI_PROJECT=id.wikipedia

# --- Batas baris tabel pada docs/data.json ---
TABEL_CVE_LIMIT=40
TABEL_KEV_LIMIT=20
TABEL_RSS_LIMIT=5
TABEL_USGS_LIMIT=5
