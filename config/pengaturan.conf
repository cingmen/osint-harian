# --- Identitas ---
PROJECT_NAME=osint-harian
CONTACT=https://cingmen.github.io/osint-harian
SITE_BASE=https://cingmen.github.io/osint-harian

# --- Ambang & retensi ---
ANOMALI_THRESHOLD=3
RETENTION_DAYS=90
RSS_MAX_ITEMS=50
TELEGRAM_LIMIT=4000
SNIPPET_MAX=300

# --- Kata kunci pemantauan (dipisah koma, case-insensitive) ---
KEYWORDS_WATCH=sanction,eruption,zero-day

# --- Wikipedia (pageviews) ---
WIKI_PROJECT=id.wikipedia

# --- Batas baris tabel pada docs/data.json ---
TABEL_CVE_LIMIT=40
TABEL_KEV_LIMIT=20
TABEL_RSS_LIMIT=5
TABEL_USGS_LIMIT=5
